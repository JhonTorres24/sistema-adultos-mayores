<div class="d-flex" style="min-height: 100vh;">
  <!-- Menú Lateral -->
  <div class="bg-dark text-white p-3" style="width: 250px;">
    <h4 class="text-center mb-4">Panel de Control</h4>
    <ul class="nav flex-column">
      <li class="nav-item mb-2">
        <a class="nav-link text-white active bg-primary rounded" routerLink="/dashboard">Inicio</a>
      </li>
      <li class="nav-item mb-2">
        <a class="nav-link text-white" routerLink="/adultos">Registrar / Ver Adultos</a>
      </li>
      <li class="nav-item mt-5">
        <button class="btn btn-danger w-100" (click)="cerrarSesion()">Cerrar Sesión</button>
      </li>
    </ul>
  </div>

  <!-- Contenido Principal -->
  <div class="flex-grow-1 p-4 bg-light">
    <h2 class="mb-4">Bienvenido al Sistema</h2>
    <div class="row">
      <div class="col-md-4 mb-3">
        <div class="card shadow-sm border-primary">
          <div class="card-body text-center">
            <h5 class="card-title">Adultos Registrados</h5>
            <h1 class="display-4 text-primary">{{ totalAdultos }}</h1>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card shadow-sm border-success">
          <div class="card-body text-center">
            <h5 class="card-title">Visitas este mes</h5>
            <h1 class="display-4 text-success">0</h1>
          </div>
        </div>
      </div>
      <div class="col-md-4 mb-3">
        <div class="card shadow-sm border-warning">
          <div class="card-body text-center">
            <h5 class="card-title">Alertas Activas</h5>
            <h1 class="display-4 text-warning">0</h1>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
