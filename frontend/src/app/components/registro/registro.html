<div class="container d-flex justify-content-center align-items-center py-5" style="min-height: 100vh; background-color: var(--fondo-gris);">
  <div class="card p-4 p-md-5 border-0 shadow-lg" style="max-width: 520px; width: 100%; border-radius: 16px;">
    
    <div class="text-center mb-4">
      <div class="mb-2">
        <i class="bi bi-person-plus-fill display-4" style="color: var(--azul-marino);"></i>
      </div>
      <h2 class="fw-bold mt-3" style="font-family: 'Merriweather', serif; color: var(--azul-marino);">Crear una Cuenta</h2>
      <p class="text-muted small">Regístrate para acceder a la plataforma de gestión y bienestar.</p>
    </div>

    <form (ngSubmit)="onRegistro()">
      <div class="mb-3">
        <label class="form-label fw-bold small">Nombre completo</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-person"></i></span>
          <input type="text" class="form-control border-start-0" name="nombre" [(ngModel)]="nombre" placeholder="Ej: Jhon Torres" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">Correo electrónico</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-envelope"></i></span>
          <input type="email" class="form-control border-start-0" name="correo" [(ngModel)]="correo" placeholder="ejemplo@correo.com" required>
        </div>
      </div>

      <div class="mb-3">
        <label class="form-label fw-bold small">Contraseña</label>
        <div class="input-group">
          <span class="input-group-text bg-white border-end-0"><i class="bi bi-lock"></i></span>
          <input type="password" class="form-control border-start-0" name="password" [(ngModel)]="password" placeholder="Crea una contraseña segura" required>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label fw-bold small">Tipo de Usuario</label>
        <select class="form-select" name="rol" [(ngModel)]="rol">
          <option value="cuidador">Cuidador / Familiar</option>
          <option value="admin">Administrador</option>
        </select>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-3 rounded-3 fw-bold mb-3">
        Registrarme <i class="bi bi-arrow-right"></i>
      </button>
    </form>

    <div class="text-center mt-3">
      <span class="text-muted small">¿Ya tienes una cuenta?</span>
      <a routerLink="/login" class="text-decoration-none fw-bold ms-1" style="color: var(--verde-menta);">Inicia Sesión aquí</a>
    </div>

  </div>
</div>
